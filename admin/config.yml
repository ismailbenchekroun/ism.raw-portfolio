backend:
  name: github
  repo: ismailbenchekroun/ism.raw-portfolio
  branch: main
  auth_type: pkce
  app_id: Ov23liGfiGc07YUeTrgw

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  # --- HOMEPAGE ---
  - name: home
    label: "Homepage"
    files:
      - name: home
        label: "Homepage Content"
        file: "_data/home.yml"
        fields:
          - { label: "Hero Title",        name: hero_title,       widget: string }
          - { label: "Hero Body Text",     name: hero_body,        widget: text }
          - { label: "Hero Image",         name: hero_image,       widget: image }
          - { label: "Hero Image Alt",     name: hero_image_alt,   widget: string }
          - { label: "Hero Button Label",  name: hero_cta_label,   widget: string }
          - { label: "Journey Title",      name: journey_title,    widget: string }
          - label: "Journey Photos"
            name: journey_photos
            widget: list
            fields:
              - { label: "Image",    name: image, widget: image }
              - { label: "Alt text", name: alt,   widget: string }
          - { label: "Journey Button Label", name: journey_cta_label, widget: string }

  # --- GALLERY COLLECTIONS LIST ---
  - name: galleries_index
    label: "Gallery Collections"
    files:
      - name: galleries
        label: "All Collections"
        file: "_data/galleries.yml"
        fields:
          - label: "Collections"
            name: ""
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "ID (no spaces)",   name: id,          widget: string }
              - { label: "Title",            name: title,       widget: string }
              - { label: "Subtitle",         name: subtitle,    widget: string }
              - { label: "Description",      name: description, widget: text }
              - { label: "Cover Image",      name: cover,       widget: image }
              - { label: "Cover Alt Text",   name: cover_alt,   widget: string }
              - { label: "URL path",         name: url,         widget: string }

  # --- LONDON GALLERY ---
  - name: gallery_london
    label: "Gallery: London Q1-26"
    files:
      - name: photos
        label: "Photos"
        file: "_data/gallery_london.yml"
        fields:
          - { label: "Title",       name: title,       widget: string }
          - { label: "Subtitle",    name: subtitle,    widget: string }
          - { label: "Description", name: description, widget: text }
          - { label: "Cover Image", name: cover,       widget: image }
          - label: "Photos"
            name: photos
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo",   name: image,   widget: image }
              - { label: "Caption", name: caption, widget: string, required: false }

  # --- 4L TROPHY GALLERY ---
  - name: gallery_4l
    label: "Gallery: 4L Trophy"
    files:
      - name: photos
        label: "Photos"
        file: "_data/gallery_4l.yml"
        fields:
          - { label: "Title",       name: title,       widget: string }
          - { label: "Subtitle",    name: subtitle,    widget: string }
          - { label: "Description", name: description, widget: text }
          - { label: "Cover Image", name: cover,       widget: image }
          - label: "Photos"
            name: photos
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo",   name: image,   widget: image }
              - { label: "Caption", name: caption, widget: string, required: false }

  # --- TRAVELS GALLERY ---
  - name: gallery_travels
    label: "Gallery: Travels"
    files:
      - name: photos
        label: "Photos"
        file: "_data/gallery_travels.yml"
        fields:
          - { label: "Title",       name: title,       widget: string }
          - { label: "Subtitle",    name: subtitle,    widget: string }
          - { label: "Description", name: description, widget: text }
          - { label: "Cover Image", name: cover,       widget: image }
          - label: "Photos"
            name: photos
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo",   name: image,   widget: image }
              - { label: "Caption", name: caption, widget: string, required: false }

  # --- ABOUT ---
  - name: about
    label: "About"
    files:
      - name: about
        label: "About Page"
        file: "_data/about.yml"
        fields:
          - { label: "Name",            name: name,                widget: string }
          - { label: "Subtitle",        name: subtitle,            widget: string }
          - { label: "Bio",             name: bio,                 widget: text }
          - { label: "Portrait Photo",  name: portrait,            widget: image }
          - { label: "Portrait Alt",    name: portrait_alt,        widget: string }
          - { label: "Section Title",   name: section_title,       widget: string }
          - { label: "Section Sub",     name: section_subtitle,    widget: string }
          - { label: "Section Image",   name: section_image,       widget: image }
          - { label: "Section CTA",     name: section_cta_label,   widget: string }

  # --- SITE SETTINGS ---
  - name: settings
    label: "Site Settings"
    files:
      - name: site
        label: "Global"
        file: "_data/site.yml"
        fields:
          - { label: "Site Name",      name: name,          widget: string }
          - { label: "Email",          name: email,         widget: string }
          - { label: "Location",       name: location,      widget: string }
          - { label: "Address Line 1", name: address_line1, widget: string }
          - { label: "Address Line 2", name: address_line2, widget: string }
          - { label: "Instagram URL",  name: instagram,     widget: string, required: false }
