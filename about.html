---
layout: default
title: About
---

<main>

  <!-- 1. SCROLL STAGE: portrait → name reveal -->
  <section class="about-scroll-stage" id="aboutScrollStage">
    <div class="about-sticky" id="aboutSticky">

      <!-- Portrait: clips from right as you scroll -->
      <div class="about-portrait-full">
        <img src="{{ site.data.about.portrait | relative_url }}"
             alt="{{ site.data.about.portrait_alt }}"
             loading="eager" id="aboutPortraitImg">
      </div>

      <!-- Name panel: slides in from right -->
      <div class="about-name-panel" id="aboutNamePanel">
        <h1 class="about-opener-name">{{ site.data.about.name }}</h1>
      </div>

      <!-- Scroll nudge: visible on full portrait, fades as panel arrives -->
      <div class="about-sticky-nudge gallery-intro-scroll" id="aboutScrollNudge" aria-hidden="true">
        <span></span>
      </div>

    </div>
  </section>

  <!-- 2. STORY: camera photo + bio side by side -->
  <section class="about-story">
    <div class="about-camera-col reveal">
      <img src="{{ site.data.about.section_image | relative_url }}"
           alt="{{ site.data.about.section_image_alt }}"
           loading="lazy">
    </div>
    <div class="about-bio-col reveal delay-1">
      {{ site.data.about.bio | markdownify }}
    </div>
  </section>

  <!-- 3. CTA -->
  <section class="about-cta-section reveal">
    <h2 class="about-cta-title">{{ site.data.about.section_title }}</h2>
    <p class="about-cta-sub">{{ site.data.about.section_subtitle }}</p>
    <a href="{{ site.data.about.section_cta_link | relative_url }}" class="btn">{{ site.data.about.section_cta_label }}</a>
  </section>

</main>
