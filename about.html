---
layout: default
title: About
---

<main>

  <!-- 1. OPENER: portrait left, name right, full viewport -->
  <section class="about-opener">
    <div class="about-opener-img">
      <img src="{{ site.data.about.portrait | relative_url }}" alt="{{ site.data.about.portrait_alt }}" loading="eager">
    </div>
    <div class="about-opener-text">
      <div class="about-opener-inner fade-in">
        <h1 class="about-opener-name">{{ site.data.about.name }}</h1>
      </div>
      <div class="gallery-intro-scroll fade-in delay-2" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <!-- 2. BIO: centered, large serif -->
  <section class="about-bio-section">
    <div class="about-bio-inner reveal">
      {{ site.data.about.bio | markdownify }}
    </div>
  </section>

  <!-- 3. CAMERA PHOTO: the photographer -->
  <section class="about-camera-section">
    <div class="about-camera-img reveal">
      <img src="{{ site.data.about.section_image | relative_url }}" alt="{{ site.data.about.section_image_alt }}" loading="lazy">
    </div>
  </section>

  <!-- 4. CTA -->
  <section class="about-cta-section reveal">
    <h2 class="about-cta-title">{{ site.data.about.section_title }}</h2>
    <p class="about-cta-sub">{{ site.data.about.section_subtitle }}</p>
    <a href="{{ site.data.about.section_cta_link | relative_url }}" class="btn">{{ site.data.about.section_cta_label }}</a>
  </section>

</main>
