name: Ismail T-Benchekroun
subtitle: Bio
bio: |
  It's the chase for me really, the chase of a feeling I first got when I developed my dad's camera, an undeveloped roll from the early 2000s that had been sitting forgotten for twenty years. What came out of it felt like a piece of my family was handed back to me, like time had been quietly waiting to be
  opened. I've been shooting ever since, because somewhere in that feeling I understood that I was now responsible for doing the same for someone else.
  Though it started with friends, family, and moments that felt worth preserving — then everything else got to me too. A burst of light cutting through a gap in the buildings, a single human figure dwarfed by some massive, completely ordinary structure in the background. The obsession widened, and little by
  little, I started seeing pictures everywhere.
