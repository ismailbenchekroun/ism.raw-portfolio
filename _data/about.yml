name: Ismail T-Benchekroun
subtitle: Bio
bio: >
  It's the chase for me really, the chase of a feeling I first got when I
  developed my dad's camera, an undeveloped roll from the early 2000s that had
  been forgotten for twenty years. What came out of it felt like a piece of my
  family was handed back to me, like time had been quietly waiting to be
  opened. 


  I've been shooting ever since, because somewhere in that feeling I understood
  that I was now responsible for doing the same for someone else.


  Even though it started with friends, family, or just moments that felt worth
  preserving, everything else around me then started feeling like it was worth
  shooting. 


  From a burst of light cutting through a gap in the buildings, to the
  converging lines of train tracks in perspective,    the obsession widened, and
  little by little I started seeing pictures everywhere.
