name: "Ismail T-Benchekroun"
subtitle: "Description"
bio: "Shooting on 35mm film with a Nikon F60, based in London. I'm drawn to portraits, geometric patterns, and the quiet poetry of everyday life. 
I started shooting film in 2022, when I discovered my dad's old camera with an undeveloped film from the early 2000's. 
What I found in those pictures was a window into the past, it really felt like the picture were moving, it felt like a part of my grandparents, my parents, and my childhood was being revealed to me.
My dad was quite literally capturing a litte drop of the universe, and freezed it in time. 
Everytime I shoot, especially portraits of people, its an exilirating feeling to see time slow down as you're about to press, its like you're in the zone , where you're about to extract an emotion out of the person in front of you, and you're about to capture a moment that will never happen again, but one that you'll always remember. 
It truly is a magical way to communicate, between subject and photographer, it feels like there is a totally different language being spoken, and the camera is the only translator.

On trips, taking pictures of people with no instant feedback, means that you spend more time thinking about the photography, thinking about how to freeze it at just the right time, rather than thinking of experimenting. 
It's a bit crazy, for each roll, I have one or two pictures that I know " "contain something"  " and then I forget about it, and then I develop them, and its like that feeling I had when shooting just burst back in my face.
Little by little, my nerd mind is getting curious about the composition, bursts of light, colours, lines of perspective and how they can be used to tell a story.



