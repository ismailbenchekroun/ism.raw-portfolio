media:
  input: images/uploads
  output: /images/uploads
  extensions: [jpg, jpeg, png, webp, gif, avif]

content:

  # --- HOMEPAGE ---
  - name: home
    label: Homepage
    type: file
    path: _data/home.yml
    # Browse entire images tree so any gallery photo can be picked
    media:
      input: images
      output: /images
      extensions: [jpg, jpeg, png, webp, gif, avif]
    fields:
      - { name: hero_title,          label: "Hero Title",                    type: string }
      - { name: hero_body,           label: "Hero Body Text",                type: text }
      - { name: hero_image,          label: "Hero Image — Desktop",          type: image }
      - { name: hero_image_mobile,   label: "Hero Image — Mobile",           type: image }
      - { name: hero_image_alt,      label: "Hero Image Alt Text",           type: string }
      - { name: hero_cta_label,      label: "Hero Button Label",             type: string }
      - { name: journey_title,       label: "Journey Section Title",         type: string }
      - name: journey_photos
        label: "Journey Photos"
        type: object
        list: true
        fields:
          - { name: image, label: "Photo", type: image }
          - { name: alt,   label: "Alt Text", type: string }
      - { name: journey_cta_label,   label: "Journey Button Label",          type: string }

  # --- ABOUT ---
  - name: about
    label: About
    type: file
    path: _data/about.yml
    media:
      input: images/about ism.raw
      output: /images/about ism.raw
      extensions: [jpg, jpeg, png, webp, gif, avif]
    fields:
      - { name: name,              label: "Name",                type: string }
      - { name: subtitle,          label: "Subtitle",            type: string }
      - { name: bio,               label: "Bio",                 type: text }
      - { name: portrait,          label: "Portrait Photo",      type: image }
      - { name: portrait_alt,      label: "Portrait Alt Text",   type: string }
      - { name: section_title,     label: "CTA Title",           type: string }
      - { name: section_subtitle,  label: "CTA Subtitle",        type: string }
      - { name: section_image,     label: "Camera Photo",        type: image }
      - { name: section_image_alt, label: "Camera Photo Alt",    type: string }
      - { name: section_cta_label, label: "CTA Button Label",    type: string }
      - { name: section_cta_link,  label: "CTA Button Link",     type: string }

  # --- SITE SETTINGS ---
  - name: site
    label: Site Settings
    type: file
    path: _data/site.yml
    fields:
      - { name: name,          label: "Site Name",      type: string }
      - { name: email,         label: "Email",          type: string }
      - { name: location,      label: "Location",       type: string }
      - { name: address_line1, label: "Address Line 1", type: string }
      - { name: address_line2, label: "Address Line 2", type: string }
      - { name: instagram,     label: "Instagram URL",  type: string }

  # --- GALLERY: LONDON Q2-2026 ---
  - name: gallery_london_q2_2026
    label: "Gallery: London Q2-2026"
    type: file
    path: _data/gallery_london_q2_2026.yml
    media:
      input: images/London Q2-2026
      output: /images/London Q2-2026
      extensions: [jpg, jpeg, png, webp]
    fields:
      - { name: title,            label: Title,            type: string }
      - { name: subtitle,         label: Subtitle,         type: string }
      - { name: description,      label: Description,      type: text }
      - { name: long_description, label: "Long Description (intro screen)", type: text }
      - { name: cover,            label: "Cover Image",    type: image }
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - { name: image,   label: Photo,   type: image }
          - { name: caption, label: Caption, type: string }

