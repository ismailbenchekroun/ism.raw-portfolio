---
layout: default
title: Gallery
---

<main>
  <section class="gallery-page">
    <div class="gallery-header reveal">
      <h1 class="gallery-title">{{ site.data.gallery.title }}</h1>
    </div>
    <div class="gallery-grid">
      {% for photo in site.data.gallery.photos %}
      <div class="gallery-item reveal" data-index="{{ forloop.index0 }}">
        <div class="gallery-img-wrap">
          <img
            src="{{ photo.image | relative_url }}"
            alt="{{ photo.caption | default: 'Photo' }}"
            loading="lazy"
            onclick="openLightbox({{ forloop.index0 }})"
          >
        </div>
        {% if photo.caption and photo.caption != "" %}
        <p class="gallery-caption">{{ photo.caption }}</p>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </section>
</main>

<script>
  const galleryPhotos = [
    {% for photo in site.data.gallery.photos %}
    { src: "{{ photo.image | relative_url }}", caption: "{{ photo.caption | escape }}" }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
</script>
