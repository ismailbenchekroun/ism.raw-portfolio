<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.data.site.name }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
  {% include nav.html %}

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <ul>
      <li><a href="javascript:void(0)" onclick="closeMobileMenu(); openGalleryPicker();">Gallery</a></li>
      <li><a href="{{ '/about' | relative_url }}" onclick="closeMobileMenu()">About</a></li>
      <li><a href="{{ '/contact' | relative_url }}" onclick="closeMobileMenu()">Contact</a></li>
    </ul>
    <button class="mobile-theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
      <span id="mobileThemeLabel">Dark</span>
    </button>
  </div>

  <!-- Gallery picker overlay -->
  <div class="gallery-picker" id="galleryPicker">
    <button class="gallery-picker-close" onclick="closeGalleryPicker()" aria-label="Close">
      <span></span><span></span>
    </button>
    <div class="gallery-picker-inner">
      <p class="gallery-picker-label">Select a collection</p>
      <div class="gallery-picker-grid">
        {% for g in site.data.galleries %}
        <a class="gallery-card" href="{{ g.url | relative_url }}" onclick="closeGalleryPicker()">
          <div class="gallery-card-img">
            <img src="{{ g.cover | relative_url }}" alt="{{ g.cover_alt }}" loading="lazy" decoding="async">
          </div>
          <div class="gallery-card-info">
            <p class="gallery-card-sub">{{ g.subtitle }}</p>
            <h3 class="gallery-card-title">{{ g.title }}</h3>
            <p class="gallery-card-desc">{{ g.description }}</p>
          </div>
        </a>
        {% endfor %}
      </div>
    </div>
  </div>

  {{ content }}

  {% include footer.html %}

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
    <button class="lightbox-prev" onclick="lightboxPrev()" aria-label="Previous">&#8592;</button>
    <button class="lightbox-next" onclick="lightboxNext()" aria-label="Next">&#8594;</button>
    <div class="lightbox-img-wrap">
      <img id="lightboxImg" src="" alt="">
    </div>
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <script src="{{ '/js/main.js' | relative_url }}"></script>
</body>
</html>
