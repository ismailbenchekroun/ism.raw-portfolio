---
layout: default
title: Contact
---

<main>
  <!-- Request Your Session -->
  <section class="contact-session reveal">
    <div class="contact-session-text">
      <h1 class="contact-title">Request Your Session</h1>
      <p class="contact-sub">Complete the brief inquiry form below; a private consultation will follow to craft imagery attuned to your vision.</p>
    </div>
    <div class="contact-session-image">
      <img src="{{ '/images/Portsu/IMG_5007.jpg' | relative_url }}" alt="Portrait of Lily" loading="lazy">
    </div>
  </section>

  <!-- Begin a Conversation -->
  <section class="contact-form-section">
    <div class="contact-form-left reveal">
      <h2 class="contact-form-title">Begin a Conversation</h2>
      <p class="contact-form-sub">Share your vision, and together we will craft photographs that endure.</p>
    </div>
    <form
      class="contact-form reveal delay-1"
      action="https://formspree.io/f/YOUR_FORM_ID"
      method="POST"
    >
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name <span class="required">(required)</span></label>
          <input type="text" id="firstName" name="firstName" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name <span class="required">(required)</span></label>
          <input type="text" id="lastName" name="lastName" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email <span class="required">(required)</span></label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">Message <span class="required">(required)</span></label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-submit">Send</button>
    </form>
  </section>
</main>
