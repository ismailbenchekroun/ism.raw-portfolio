---
layout: default
title: Contact
---

{% assign c = site.data.contact %}

<main>
  <!-- Request Your Session -->
  <section class="contact-session reveal">
    <div class="contact-session-text">
      <h1 class="contact-title">{{ c.session_title }}</h1>
      <p class="contact-sub">{{ c.session_body }}</p>
    </div>
    <div class="contact-session-image">
      <img src="{{ c.session_image | relative_url }}" alt="{{ c.session_image_alt }}" loading="lazy">
    </div>
  </section>

  <!-- Begin a Conversation -->
  <section class="contact-form-section">
    <div class="contact-form-left reveal">
      <h2 class="contact-form-title">{{ c.form_title }}</h2>
      <p class="contact-form-sub">{{ c.form_body }}</p>
    </div>
    <form
      class="contact-form reveal delay-1"
      action="{{ c.form_action }}"
      method="POST"
    >
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name <span class="required">(required)</span></label>
          <input type="text" id="firstName" name="firstName" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name <span class="required">(required)</span></label>
          <input type="text" id="lastName" name="lastName" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email <span class="required">(required)</span></label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">Message <span class="required">(required)</span></label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-submit">{{ c.submit_label }}</button>
    </form>
  </section>
</main>
